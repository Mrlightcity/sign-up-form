<!DOCTYPE html>
<html lang="en">
<head>
    <script src="./form.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up form</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <main class="container">
        <div class="left">
            <div class="logo">
                <div class="odin-img" id="oimg">
                    <img src="./assets/odin-lined (1).png" alt="Odin Logo" height="85vh" width="auto">
                </div>
                <div class="odin-txt" id="otxt">ODIN</div>
            </div>
        </div>
        <div class="right">
            <div class="top">
                <h4>This is not a real online service! You know you need something
                     <br>like this in your life to help you realize your deepest dreams.
                      <br> Sign up <em>now</em> to get started. 
                      <br><br>You <em>know</em> you want to.</h4>
            </div>
            <form action="#" method="get" class="main-form">
                <div class="mid">
                    <h1>Let's do this!</h1>
                    <div class="myForms">
                        <div>
                            <div>
                                <label for="first_name">FIRST NAME</label>
                            </div>
                            <input type="text" id="first_name" name="first_name" placeholder="Thor">
    
                            <div><label for="email">EMAIL</label></div>
                            <input type="email" id="email" name="email">
    
                            <div><label for="password">PASSWORD</label></div>
                            <input type="password" id="password" name="password" required>
                        </div>
                        <div>
                            <div>
                                <label for="last_name">LAST NAME</label>
                            </div>
                            <input type="text" id="last_name" name="last_name" placeholder="Odioson">
    
                            <div><label for="phone_number">PHONE NUMBER</label></div>
                            <input type="tel" id="phone_number" name="phone_number">
    
                            <div><label for="confirm_password">CONFIRM PASSWORD</label></div>
                            <input type="password" id="confirm_password" name="confirm_password" required>
                        </div>
                    </div>
                </div>
                <div class="end">
                    <button class="btn" type="submit">Create Account</button>
                    <div class="txt">Already have an account? <a href="#">Log in</a></div>
                </div> 
            </form>
        </div>
    </main>
</body>
</html>
