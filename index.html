<!DOCTYPE html>
<html lang="en">
<head>
    <script src="./form.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up form</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <main class="container">
        <div class="left">
            <h2>Hello</h2>
        </div>
        <div class="right">
            <div class="top">
                <h2>This is not a real online service! You know you need something
                     <br>like this in your life to help you realize your deepest dreams.
                      <br> Sign up <em>now</em> to get started. 
                      <br><br>You <em>know</em> you want to.</h2>
            </div>
            <div class="mid">
                <h2>Let's do this!</h2>
                <div class="myForms">
                    <form action="#" method="post">
                        <div>
                            <label for="first_name">First Name</label>
                        </div>
                        <input type="text" id="first_name" name="first_name" placeholder="Thor">

                        <div><label for="email">Email</label></div>
                        <input type="email" id="email" name="email">

                        <div><label for="password">Password</label></div>
                        <input type="password" id="password" name="password">
                    </form>
                </div>
            </div>
            <div class="end"></div>
        </div>
    </main>
</body>
</html>
